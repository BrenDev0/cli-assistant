[project]
name = "cli-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.5.4",
    "langchain-openai>=1.4.1",
    "prompt-toolkit>=3.0.53",
    "pydantic-settings>=2.14.2",
    "selenium>=4.49.0",
    "sounddevice>=0.5.6",
    "tavily-python>=0.8.0",
]

[project.scripts]
# a shell command cannot contain a space, so both spellings of "the way" are registered
the-way = "src.cli.main:chat"
theway = "src.cli.main:chat"
# same assistant, spanish interface
the-way-es = "src.cli.main:chat_es"
theway_es = "src.cli.main:chat_es"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
